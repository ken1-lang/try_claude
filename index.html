<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電卓</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #eef0f4; font-family: system-ui, sans-serif;
  }
  .calc {
    position: relative; width: 320px; padding: 16px; background: #fff; border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,.12);
  }
  .display {
    height: 80px; margin-bottom: 12px; padding: 8px 12px; background: #f5f6f8;
    border-radius: 10px; text-align: right; overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  .expr { min-height: 20px; color: #888; font-size: 14px; word-break: break-all; }
  .value { font-size: 32px; font-weight: 600; word-break: break-all; }
  .tools { display: grid; grid-template-columns: .8fr 1.1fr 1.6fr .8fr; gap: 8px; margin-bottom: 8px; }
  .tools button { height: 44px; font-size: 14px; padding: 0 4px; white-space: nowrap; }
  .tools button#sqrtBtn { font-size: 20px; }
  .settings {
    position: absolute; inset: 0; z-index: 10; padding: 24px 20px; background: #fff;
    border-radius: 16px; display: flex; flex-direction: column; gap: 12px;
  }
  .settings[hidden] { display: none; }
  .settings h2 { margin: 0; font-size: 18px; }
  .settings label { font-size: 14px; color: #444; }
  .settings .rate-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .settings input {
    width: 120px; height: 44px; padding: 0 10px; font-size: 20px; text-align: right;
    border: 1px solid #c4c8d0; border-radius: 10px;
  }
  .settings .error { min-height: 18px; color: #c0392b; font-size: 13px; }
  .settings .actions { display: flex; gap: 8px; }
  .settings .actions button { flex: 1; height: 44px; font-size: 16px; }
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
  .modes button { height: 44px; font-size: 15px; }
  .modes button.on { background: #3b82f6; color: #fff; }
  .hexkeys { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 8px; }
  .hexkeys[hidden] { display: none; }
  .hexkeys button { height: 44px; font-size: 16px; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button:disabled:active { filter: none; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  button {
    height: 56px; border: 0; border-radius: 10px; font-size: 20px; cursor: pointer;
    background: #e8eaee; color: #222;
  }
  button:active { filter: brightness(.9); }
  button.op { background: #ffb347; }
  button.fn { background: #d0d4dc; }
  button.eq { background: #3b82f6; color: #fff; }
  .history { margin-top: 12px; border-top: 1px solid #e3e5ea; padding-top: 8px; }
  .history-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #666; }
  .history-head button { height: auto; padding: 4px 8px; font-size: 12px; background: #e8eaee; }
  .history-head button:disabled { opacity: .4; cursor: not-allowed; }
  .history-actions { display: flex; gap: 6px; }
  .history ul { list-style: none; margin: 6px 0 0; padding: 0; max-height: 140px; overflow-y: auto; }
  .history li { padding: 6px 8px; border-radius: 6px; text-align: right; cursor: pointer; font-size: 14px; word-break: break-all; }
  .history li:hover { background: #f0f2f6; }
  .history li small { display: block; color: #888; font-size: 12px; }
  .history .empty { color: #aaa; text-align: center; cursor: default; }
  .history .empty:hover { background: none; }
</style>
</head>
<body>
<div class="calc">
  <div class="display">
    <div class="expr" id="expr"></div>
    <div class="value" id="value">0</div>
  </div>
  <div class="tools">
    <button class="fn" type="button" id="allClear">AC</button>
    <button class="fn" type="button" id="openSettings">⚙ 設定</button>
    <button class="op" type="button" id="taxBtn">消費税(10%)</button>
    <button class="op" type="button" id="sqrtBtn" aria-label="平方根">√</button>
  </div>
  <div class="modes" role="group" aria-label="進数">
    <button type="button" data-mode="10" class="on" aria-pressed="true">10進数</button>
    <button type="button" data-mode="2" aria-pressed="false">2進数</button>
    <button type="button" data-mode="16" aria-pressed="false">16進数</button>
  </div>
  <div class="hexkeys" id="hexkeys" hidden>
    <button type="button" data-in="A">A</button><button type="button" data-in="B">B</button><button type="button" data-in="C">C</button>
    <button type="button" data-in="D">D</button><button type="button" data-in="E">E</button><button type="button" data-in="F">F</button>
  </div>
  <div class="keys">
    <button class="fn" data-act="clear">C</button>
    <button class="fn" data-act="back">⌫</button>
    <button class="fn" data-in="%">%</button>
    <button class="op" data-in="÷">÷</button>
    <button data-in="7">7</button><button data-in="8">8</button><button data-in="9">9</button>
    <button class="op" data-in="×">×</button>
    <button data-in="4">4</button><button data-in="5">5</button><button data-in="6">6</button>
    <button class="op" data-in="−">−</button>
    <button data-in="1">1</button><button data-in="2">2</button><button data-in="3">3</button>
    <button class="op" data-in="+">+</button>
    <button data-in="0">0</button><button data-in=".">.</button>
    <button class="eq" data-act="eq" style="grid-column: span 2">=</button>
  </div>
  <div class="settings" id="settings" hidden>
    <h2>設定</h2>
    <div>
      <label for="taxRate">消費税率(%)</label>
      <div class="rate-row"><input id="taxRate" type="text" inputmode="decimal" autocomplete="off"><span>%</span></div>
    </div>
    <div class="error" id="settingsError" role="alert"></div>
    <div class="actions">
      <button class="fn" type="button" id="cancelSettings">キャンセル</button>
      <button class="eq" type="button" id="saveSettings">保存</button>
    </div>
  </div>
  <div class="history">
    <div class="history-head">
      <span>履歴</span>
      <span class="history-actions">
        <button id="downloadHistory" type="button">ダウンロード</button>
        <button id="clearHistory" type="button">履歴を消去</button>
      </span>
    </div>
    <ul id="history"></ul>
  </div>
</div>
<script>
  const OPS = ['+', '−', '×', '÷'];
  let expr = '';        // 入力中の式
  let mode = 10;        // 進数(10 / 2 / 16)
  const DIGITS = { 10: '0123456789', 2: '01', 16: '0123456789ABCDEF' };
  // 値を現在(または指定)の進数の文字列にする。10進数は誤差を丸める
  const fmt = (v, m = mode) => m === 10 ? String(parseFloat(v.toPrecision(12))) : v.toString(m).toUpperCase();
  let justEvaluated = false;

  const $expr = document.getElementById('expr');
  const $value = document.getElementById('value');
  const $history = document.getElementById('history');

  // 履歴(新しい順)。localStorage に保存し、使えない環境ではメモリのみ
  const HISTORY_KEY = 'calc-history';
  const HISTORY_MAX = 50;
  let calcHistory = [];
  try { calcHistory = JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch (e) {}

  // 履歴に1件追加(新しい順・上限あり)
  function record(exprText, result) {
    calcHistory.unshift({ expr: exprText, result, t: Date.now(), base: mode });
    calcHistory = calcHistory.slice(0, HISTORY_MAX);
    saveHistory(); renderHistory();
  }

  function saveHistory() {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(calcHistory)); } catch (e) {}
  }

  const $download = document.getElementById('downloadHistory');

  function renderHistory() {
    $history.textContent = '';
    $download.disabled = calcHistory.length === 0;
    if (calcHistory.length === 0) {
      const li = document.createElement('li');
      li.className = 'empty'; li.textContent = '履歴はありません';
      $history.appendChild(li);
      return;
    }
    calcHistory.forEach((h) => {
      const li = document.createElement('li');
      const small = document.createElement('small');
      small.textContent = (h.base && h.base !== 10 ? `(${h.base}進数) ` : '') + h.expr + ' =';
      li.append(small, h.result);
      li.dataset.result = h.result;
      li.dataset.base = h.base || 10;
      $history.appendChild(li);
    });
  }

  // 履歴をクリックすると、その結果を続けて使える
  $history.addEventListener('click', (e) => {
    const li = e.target.closest('li');
    if (!li || !li.dataset.result) return;
    const hb = Number(li.dataset.base);
    if (hb === mode) expr = li.dataset.result;
    else {
      // 別の進数で記録された結果は、現在の進数に変換して使う
      const v = hb === 10 ? parseFloat(li.dataset.result) : parseInt(li.dataset.result, hb);
      if (mode !== 10 && !Number.isInteger(v)) { render('整数のみ変換できます'); return; }
      expr = fmt(v);
    }
    justEvaluated = true; render();
  });

  // 履歴を CSV(UTF-8 BOM 付き・Excel で文字化けしない)でダウンロード。古い順に出力
  const pad = (n) => String(n).padStart(2, '0');
  const csvField = (v) => /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;

  function formatTime(t) {
    if (!t) return '';
    const d = new Date(t);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ` +
           `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }

  $download.addEventListener('click', () => {
    if (calcHistory.length === 0) return;
    const rows = [['日時', '式', '結果', '進数']];
    calcHistory.slice().reverse().forEach((h) => rows.push([formatTime(h.t), h.expr, h.result, String(h.base || 10)]));
    const csv = '\uFEFF' + rows.map((r) => r.map(csvField).join(',')).join('\r\n') + '\r\n';
    const now = new Date();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = `calculator-history_${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  document.getElementById('clearHistory').addEventListener('click', () => {
    calcHistory = []; saveHistory(); renderHistory();
  });

  function render(result) {
    $expr.textContent = result === undefined ? '' : expr;
    $value.textContent = result !== undefined ? result : (expr || '0');
  }

  function input(ch) {
    // 現在の進数で使えない文字(2進数の 2〜9、10進数の A〜F、10進数以外の小数点)は無視
    if (!OPS.includes(ch) && !(ch === '.' ? mode === 10 : DIGITS[mode].includes(ch))) return;
    const last = expr.slice(-1);
    if (justEvaluated) {
      // 結果に続けて演算子ならそのまま継続、数字なら新規入力
      if (!OPS.includes(ch)) expr = '';
      justEvaluated = false;
    }
    if (OPS.includes(ch)) {
      if (expr === '' ) { if (ch !== '−') return; }       // 先頭は負号のみ許可
      else if (OPS.includes(last)) expr = expr.slice(0, -1); // 連続演算子は置換
    } else if (ch === '.') {
      const cur = expr.split(/[+−×÷]/).pop();
      if (cur.includes('.')) return;
      if (cur === '') ch = '0.';
    }
    expr += ch;
    render();
  }

  function back() {
    if (justEvaluated) { expr = ''; justEvaluated = false; }
    else expr = expr.slice(0, -1);
    render();
  }

  function clearAll() { expr = ''; justEvaluated = false; render(); }

  // eval を使わず、優先順位(×÷ > +−)を考慮して計算。現在の進数で解釈する
  // 10進数以外は整数のみで、割り算は小数点以下を切り捨てる
  function calculate(s) {
    s = s.replace(/^-/, '−');   // 計算結果の負号は半角「-」。先頭なら演算子の「−」に揃える
    const dec = mode === 10;
    const tokens = s.match(dec ? /\d+\.?\d*|\.\d+|[+−×÷]/g : /[0-9A-F]+|[+−×÷]/g) || [];
    const num = (t) => dec ? parseFloat(t) : parseInt(t, mode);
    // 先頭の負号を数値に畳み込む
    if (tokens[0] === '−') { tokens.shift(); tokens[0] = '-' + tokens[0]; }
    const stack = [];
    for (let i = 0; i < tokens.length; i++) {
      const t = tokens[i];
      if (t === '×' || t === '÷') {
        const a = stack.pop();
        const b = num(tokens[++i]);
        if (t === '÷' && b === 0) throw new Error('0で割れません');
        stack.push(t === '×' ? a * b : dec ? a / b : Math.trunc(a / b));
      } else stack.push(OPS.includes(t) ? t : num(t));
    }
    let result = stack[0];
    for (let i = 1; i < stack.length; i += 2) {
      const n = stack[i + 1];
      result = stack[i] === '+' ? result + n : result - n;
    }
    if (!dec && !Number.isSafeInteger(result)) throw new Error('数値が大きすぎます');
    return result;
  }

  function evaluate() {
    if (!expr) return;
    let s = expr;
    if (OPS.includes(s.slice(-1))) s = s.slice(0, -1);
    if (!s) return;
    try {
      const r = calculate(s);
      const text = fmt(r);
      expr = s; render(text);
      record(s, text);
      expr = text; justEvaluated = true;
    } catch (e) {
      render(e.message); expr = ''; justEvaluated = false;
    }
  }

  document.querySelector('.keys').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.in) {
      if (b.dataset.in === '%') return percent();
      input(b.dataset.in);
    }
    else if (b.dataset.act === 'clear') clearAll();
    else if (b.dataset.act === 'back') back();
    else if (b.dataset.act === 'eq') evaluate();
  });

  // ---- 消費税 ----
  const TAX_KEY = 'calc-tax-rate';
  const DEFAULT_TAX = 10;
  let taxRate = DEFAULT_TAX;   // %
  try {
    const v = parseFloat(localStorage.getItem(TAX_KEY));
    if (isFinite(v) && v >= 0 && v <= 100) taxRate = v;
  } catch (e) {}

  const $taxBtn = document.getElementById('taxBtn');
  const $settings = document.getElementById('settings');
  const $taxRate = document.getElementById('taxRate');
  const $settingsError = document.getElementById('settingsError');

  function renderTaxBtn() { $taxBtn.textContent = `消費税(${taxRate}%)`; }

  // 現在の値(式なら計算結果)に消費税を加えた税込金額にする
  function applyTax() {
    if (!expr || mode !== 10) return;
    let s = expr;
    if (OPS.includes(s.slice(-1))) s = s.slice(0, -1);
    if (!s) return;
    try {
      const base = calculate(s);
      const text = String(parseFloat((base * (1 + taxRate / 100)).toPrecision(12)));
      expr = `${s} 税込(${taxRate}%)`; render(text);
      record(expr, text);
      expr = text; justEvaluated = true;
    } catch (e) {
      render(e.message); expr = ''; justEvaluated = false;
    }
  }

  // 現在の値(式なら計算結果)の平方根にする(10進数のみ)
  function applySqrt() {
    if (!expr || mode !== 10) return;
    let s = expr;
    if (OPS.includes(s.slice(-1))) s = s.slice(0, -1);
    if (!s) return;
    try {
      const v = calculate(s);
      if (v < 0) throw new Error('負の数の平方根は計算できません');
      const text = fmt(Math.sqrt(v));
      expr = `√(${s})`; render(text);
      record(expr, text);
      expr = text; justEvaluated = true;
    } catch (e) {
      render(e.message); expr = ''; justEvaluated = false;
    }
  }
  const $sqrtBtn = document.getElementById('sqrtBtn');
  $sqrtBtn.addEventListener('click', applySqrt);

  function openSettings() {
    $taxRate.value = String(taxRate); $settingsError.textContent = '';
    $settings.hidden = false; $taxRate.focus(); $taxRate.select();
  }
  function closeSettings() { $settings.hidden = true; }

  function saveSettings() {
    const text = $taxRate.value.trim().replace(/[０-９．]/g, (c) => c === '．' ? '.' : String(c.charCodeAt(0) - 0xFF10));
    const v = Number(text);
    if (text === '' || !isFinite(v) || v < 0 || v > 100) {
      $settingsError.textContent = '0〜100 の数値を入力してください';
      return;
    }
    taxRate = v;
    try { localStorage.setItem(TAX_KEY, String(v)); } catch (e) {}
    renderTaxBtn(); closeSettings();
  }

  $taxBtn.addEventListener('click', applyTax);
  document.getElementById('openSettings').addEventListener('click', openSettings);
  document.getElementById('cancelSettings').addEventListener('click', closeSettings);
  document.getElementById('saveSettings').addEventListener('click', saveSettings);
  $taxRate.addEventListener('keydown', (e) => {
    e.stopPropagation();   // 電卓本体のキー操作(Enter=計算 など)に伝えない
    if (e.key === 'Enter') { e.preventDefault(); saveSettings(); }
    else if (e.key === 'Escape') { e.preventDefault(); closeSettings(); }
  });
  renderTaxBtn();

  // ---- 進数変換 ----
  const $hexkeys = document.getElementById('hexkeys');

  function updateModeUI() {
    document.querySelectorAll('.modes button').forEach((b) => {
      const on = Number(b.dataset.mode) === mode;
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on));
    });
    $hexkeys.hidden = mode !== 16;
    // 現在の進数で使えないキーは押せなくする
    document.querySelectorAll('.keys button[data-in]').forEach((b) => {
      const k = b.dataset.in;
      b.disabled = OPS.includes(k) ? false : (k === '.' || k === '%') ? mode !== 10 : !DIGITS[mode].includes(k);
    });
    $taxBtn.disabled = mode !== 10;   // 消費税・√ は10進数のときだけ
    $sqrtBtn.disabled = mode !== 10;
  }

  // 進数を切り替え、入力中の式(式なら計算結果)を新しい進数の値に変換する
  function setMode(m) {
    if (m === mode) return;
    let v = null;
    if (expr) {
      let s = expr;
      if (OPS.includes(s.slice(-1))) s = s.slice(0, -1);
      if (s) {
        try { v = calculate(s); }
        catch (e) { render(e.message); expr = ''; justEvaluated = false; return; }
        if (m !== 10 && !Number.isInteger(v)) { render('整数のみ変換できます'); return; }
        if (m !== 10 && !Number.isSafeInteger(v)) { render('数値が大きすぎます'); return; }
      }
    }
    mode = m; updateModeUI();
    if (v !== null) { expr = fmt(v); justEvaluated = true; }
    render();
  }

  document.querySelector('.modes').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (b) setMode(Number(b.dataset.mode));
  });
  $hexkeys.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (b) input(b.dataset.in);
  });
  updateModeUI();

  // オールクリア: 入力中の式・履歴・消費税率(初期値 10% に戻す)・進数(10進数)をすべて戻す
  function allClear() {
    mode = 10; updateModeUI();
    clearAll();
    calcHistory = []; saveHistory(); renderHistory();
    taxRate = DEFAULT_TAX;
    try { localStorage.removeItem(TAX_KEY); } catch (e) {}
    renderTaxBtn(); closeSettings();
  }
  document.getElementById('allClear').addEventListener('click', allClear);

  function percent() {
    // 直近の数値を 1/100 にする(10進数のみ)
    if (mode !== 10) return;
    const m = expr.match(/(\d+\.?\d*)$/);
    if (!m) return;
    const v = String(parseFloat((parseFloat(m[1]) / 100).toPrecision(12)));
    expr = expr.slice(0, -m[1].length) + v;
    justEvaluated = false;
    render();
  }

  renderHistory();

  document.addEventListener('keydown', (e) => {
    if (!$settings.hidden) return;   // 設定画面を開いている間は電卓のキー操作を無効にする
    if (e.ctrlKey || e.metaKey || e.altKey) return;   // Ctrl+C などのショートカットは邪魔しない
    const map = { '*': '×', '/': '÷', '-': '−' };
    if (/^[0-9.+]$/.test(e.key)) input(e.key);
    else if (/^[a-fA-F]$/.test(e.key)) input(e.key.toUpperCase());
    else if (map[e.key]) { e.preventDefault(); input(map[e.key]); }
    else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); evaluate(); }
    else if (e.key === 'Backspace') back();
    else if (e.key === 'Escape' || e.key === 'Delete') clearAll();
    else if (e.key === '%') percent();
  });
</script>
</body>
</html>
