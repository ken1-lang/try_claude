<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電卓</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #eef0f4; font-family: system-ui, sans-serif;
  }
  .calc {
    width: 320px; padding: 16px; background: #fff; border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,.12);
  }
  .display {
    height: 80px; margin-bottom: 12px; padding: 8px 12px; background: #f5f6f8;
    border-radius: 10px; text-align: right; overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  .expr { min-height: 20px; color: #888; font-size: 14px; word-break: break-all; }
  .value { font-size: 32px; font-weight: 600; word-break: break-all; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  button {
    height: 56px; border: 0; border-radius: 10px; font-size: 20px; cursor: pointer;
    background: #e8eaee; color: #222;
  }
  button:active { filter: brightness(.9); }
  button.op { background: #ffb347; }
  button.fn { background: #d0d4dc; }
  button.eq { background: #3b82f6; color: #fff; }
  .history { margin-top: 12px; border-top: 1px solid #e3e5ea; padding-top: 8px; }
  .history-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #666; }
  .history-head button { height: auto; padding: 4px 8px; font-size: 12px; background: #e8eaee; }
  .history ul { list-style: none; margin: 6px 0 0; padding: 0; max-height: 140px; overflow-y: auto; }
  .history li { padding: 6px 8px; border-radius: 6px; text-align: right; cursor: pointer; font-size: 14px; word-break: break-all; }
  .history li:hover { background: #f0f2f6; }
  .history li small { display: block; color: #888; font-size: 12px; }
  .history .empty { color: #aaa; text-align: center; cursor: default; }
  .history .empty:hover { background: none; }
</style>
</head>
<body>
<div class="calc">
  <div class="display">
    <div class="expr" id="expr"></div>
    <div class="value" id="value">0</div>
  </div>
  <div class="keys">
    <button class="fn" data-act="clear">C</button>
    <button class="fn" data-act="back">⌫</button>
    <button class="fn" data-in="%">%</button>
    <button class="op" data-in="÷">÷</button>
    <button data-in="7">7</button><button data-in="8">8</button><button data-in="9">9</button>
    <button class="op" data-in="×">×</button>
    <button data-in="4">4</button><button data-in="5">5</button><button data-in="6">6</button>
    <button class="op" data-in="−">−</button>
    <button data-in="1">1</button><button data-in="2">2</button><button data-in="3">3</button>
    <button class="op" data-in="+">+</button>
    <button data-in="0">0</button><button data-in=".">.</button>
    <button class="eq" data-act="eq" style="grid-column: span 2">=</button>
  </div>
  <div class="history">
    <div class="history-head">
      <span>履歴</span>
      <button id="clearHistory" type="button">履歴を消去</button>
    </div>
    <ul id="history"></ul>
  </div>
</div>
<script>
  const OPS = ['+', '−', '×', '÷'];
  let expr = '';        // 入力中の式
  let justEvaluated = false;

  const $expr = document.getElementById('expr');
  const $value = document.getElementById('value');
  const $history = document.getElementById('history');

  // 履歴(新しい順)。localStorage に保存し、使えない環境ではメモリのみ
  const HISTORY_KEY = 'calc-history';
  const HISTORY_MAX = 50;
  let calcHistory = [];
  try { calcHistory = JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch (e) {}

  function saveHistory() {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(calcHistory)); } catch (e) {}
  }

  function renderHistory() {
    $history.textContent = '';
    if (calcHistory.length === 0) {
      const li = document.createElement('li');
      li.className = 'empty'; li.textContent = '履歴はありません';
      $history.appendChild(li);
      return;
    }
    calcHistory.forEach((h) => {
      const li = document.createElement('li');
      const small = document.createElement('small');
      small.textContent = h.expr + ' =';
      li.append(small, h.result);
      li.dataset.result = h.result;
      $history.appendChild(li);
    });
  }

  // 履歴をクリックすると、その結果を続けて使える
  $history.addEventListener('click', (e) => {
    const li = e.target.closest('li');
    if (!li || !li.dataset.result) return;
    expr = li.dataset.result; justEvaluated = true; render();
  });

  document.getElementById('clearHistory').addEventListener('click', () => {
    calcHistory = []; saveHistory(); renderHistory();
  });

  function render(result) {
    $expr.textContent = result === undefined ? '' : expr;
    $value.textContent = result !== undefined ? result : (expr || '0');
  }

  function input(ch) {
    const last = expr.slice(-1);
    if (justEvaluated) {
      // 結果に続けて演算子ならそのまま継続、数字なら新規入力
      if (!OPS.includes(ch)) expr = '';
      justEvaluated = false;
    }
    if (OPS.includes(ch)) {
      if (expr === '' ) { if (ch !== '−') return; }       // 先頭は負号のみ許可
      else if (OPS.includes(last)) expr = expr.slice(0, -1); // 連続演算子は置換
    } else if (ch === '.') {
      const cur = expr.split(/[+−×÷]/).pop();
      if (cur.includes('.')) return;
      if (cur === '') ch = '0.';
    }
    expr += ch;
    render();
  }

  function back() {
    if (justEvaluated) { expr = ''; justEvaluated = false; }
    else expr = expr.slice(0, -1);
    render();
  }

  function clearAll() { expr = ''; justEvaluated = false; render(); }

  // eval を使わず、優先順位(×÷ > +−)を考慮して計算
  function calculate(s) {
    const tokens = s.match(/\d+\.?\d*|\.\d+|[+−×÷]/g) || [];
    // 先頭の負号を数値に畳み込む
    if (tokens[0] === '−') { tokens.shift(); tokens[0] = '-' + tokens[0]; }
    const stack = [];
    for (let i = 0; i < tokens.length; i++) {
      const t = tokens[i];
      if (t === '×' || t === '÷') {
        const a = parseFloat(stack.pop());
        const b = parseFloat(tokens[++i]);
        if (t === '÷' && b === 0) throw new Error('0で割れません');
        stack.push(t === '×' ? a * b : a / b);
      } else stack.push(t);
    }
    let result = parseFloat(stack[0]);
    for (let i = 1; i < stack.length; i += 2) {
      const n = parseFloat(stack[i + 1]);
      result = stack[i] === '+' ? result + n : result - n;
    }
    return result;
  }

  function evaluate() {
    if (!expr) return;
    let s = expr;
    if (OPS.includes(s.slice(-1))) s = s.slice(0, -1);
    try {
      const r = calculate(s);
      const text = String(parseFloat(r.toPrecision(12)));
      expr = s; render(text);
      calcHistory.unshift({ expr: s, result: text });
      calcHistory = calcHistory.slice(0, HISTORY_MAX);
      saveHistory(); renderHistory();
      expr = text; justEvaluated = true;
    } catch (e) {
      render(e.message); expr = ''; justEvaluated = false;
    }
  }

  document.querySelector('.keys').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.in) {
      if (b.dataset.in === '%') return percent();
      input(b.dataset.in);
    }
    else if (b.dataset.act === 'clear') clearAll();
    else if (b.dataset.act === 'back') back();
    else if (b.dataset.act === 'eq') evaluate();
  });

  function percent() {
    // 直近の数値を 1/100 にする
    const m = expr.match(/(\d+\.?\d*)$/);
    if (!m) return;
    const v = String(parseFloat((parseFloat(m[1]) / 100).toPrecision(12)));
    expr = expr.slice(0, -m[1].length) + v;
    justEvaluated = false;
    render();
  }

  renderHistory();

  document.addEventListener('keydown', (e) => {
    const map = { '*': '×', '/': '÷', '-': '−' };
    if (/^[0-9.+]$/.test(e.key)) input(e.key);
    else if (map[e.key]) { e.preventDefault(); input(map[e.key]); }
    else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); evaluate(); }
    else if (e.key === 'Backspace') back();
    else if (e.key === 'Escape' || e.key === 'Delete') clearAll();
    else if (e.key === '%') percent();
  });
</script>
</body>
</html>
